apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-destinationrule
  namespace: three-tier-helm
spec:
  host: backend-service.three-tier-helm.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: frontend-destinationrule
  namespace: three-tier-helm
spec:
  host: frontend-service.three-tier-helm.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: frontend-session
          ttl: 3600s
    tls:
      mode: ISTIO_MUTUAL