apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: three-tier-virtualservice
  namespace: three-tier-helm
  labels:
    app: three-tier
    env: production
spec:
  hosts:
    - "*"
  gateways:
    - three-tier-gateway
  http:
    # ── Backend API ──────────────────────────────────────────────────────────
    - name: backend-route
      match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: backend-service.three-tier-helm.svc.cluster.local
            port:
              number: 8080
      # Retry policy for transient backend errors
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: gateway-error,connect-failure,retriable-4xx
      # Timeout for backend calls
      timeout: 15s

    # ── Frontend canary (90/10 split) ────────────────────────────────────────
    # New users are split here. Envoy auto-sets the frontend-session cookie
    # so returning users always land on the same pod (same version).
    - name: frontend-route
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-service.three-tier-helm.svc.cluster.local
            subset: v1
            port:
              number: 80
          weight: 90
        - destination:
            host: frontend-service.three-tier-helm.svc.cluster.local
            subset: v2
            port:
              number: 80
          weight: 10
      # Retry on frontend failures
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure
      timeout: 10s