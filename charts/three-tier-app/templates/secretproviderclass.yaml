apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.backend.secretProviderClass.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  provider: {{ .Values.backend.secretProviderClass.provider }}
  parameters:
    secrets: |
      - resourceName: {{ .Values.backend.secretProviderClass.secretResourceName | quote }}
        path: {{ .Values.backend.secretProviderClass.secretPath | quote }}
